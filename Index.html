<!doctype html>
<html lang="vi">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root { color-scheme: light; --ink:#172033; --muted:#6b7280; --line:#e8eaf0; --brand:#5b5ce2; --brand-dark:#4647c8; --surface:#fff; --bg:#f6f7fb; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(circle at top right,#e7e8ff 0,transparent 31rem),var(--bg); color:var(--ink); }
      .app { width:min(680px,calc(100% - 32px)); margin:0 auto; padding:clamp(32px,8vw,80px) 0; }
      header { margin-bottom:28px; } h1 { font-size:clamp(2rem,6vw,3.25rem); letter-spacing:-.055em; margin:0 0 8px; } .subtitle { margin:0; color:var(--muted); }
      .card { background:var(--surface); border:1px solid rgba(255,255,255,.7); border-radius:20px; box-shadow:0 18px 50px rgba(30,35,90,.08); overflow:hidden; }
      form { display:flex; gap:10px; padding:18px; border-bottom:1px solid var(--line); } input { min-width:0; flex:1; padding:12px 14px; border:1px solid #d9dce6; border-radius:11px; font:inherit; outline:none; } input:focus { border-color:var(--brand); box-shadow:0 0 0 3px #5b5ce21a; }
      button { border:0; border-radius:11px; padding:12px 16px; font:inherit; font-weight:650; cursor:pointer; transition:.18s ease; } button:hover { transform:translateY(-1px); } .primary { color:#fff; background:var(--brand); } .primary:hover { background:var(--brand-dark); }
      .toolbar { display:flex; justify-content:space-between; gap:12px; padding:16px 18px 8px; align-items:center; } .filters { display:flex; gap:5px; } .filter,.clear { background:transparent; color:var(--muted); padding:7px 9px; font-size:.88rem; } .filter.active { color:var(--brand); background:#f0f0ff; } .clear { color:#c24155; }
      ul { list-style:none; padding:0 18px; margin:0; } li { display:flex; align-items:center; gap:12px; padding:14px 2px; border-bottom:1px solid var(--line); } li:last-child { border-bottom:0; }
      .check { appearance:none; width:21px; height:21px; border:2px solid #cfd3df; border-radius:7px; cursor:pointer; flex:none; } .check:checked { background:var(--brand); border-color:var(--brand); box-shadow:inset 0 0 0 4px #fff; }
      .title { flex:1; overflow-wrap:anywhere; } .done .title { color:var(--muted); text-decoration:line-through; } .delete { color:#a5a9b5; background:transparent; padding:6px 8px; font-size:1.25rem; line-height:1; } .delete:hover { color:#dc4054; }
      .empty { padding:42px 18px 48px; text-align:center; color:var(--muted); } .empty span { display:block; font-size:2rem; margin-bottom:8px; }
      .footer { display:flex; justify-content:space-between; padding:13px 18px 18px; color:var(--muted); font-size:.9rem; } #notice { min-height:1.25em; color:#b64050; padding:10px 18px 0; font-size:.88rem; }
      @media (max-width:480px) { .app { width:min(100% - 20px,680px); padding-top:28px; } form { padding:12px; } button { padding:11px 13px; } .toolbar { padding:13px 12px 5px; } ul { padding:0 12px; } .footer { padding:12px; } }
    </style>
  </head>
  <body>
    <main class="app">
      <header><h1>Việc cần làm</h1><p class="subtitle">Tập trung vào điều quan trọng nhất hôm nay.</p></header>
      <section class="card" aria-label="Danh sách công việc">
        <form id="task-form"><input id="new-task" maxlength="200" autocomplete="off" placeholder="Thêm việc mới..." aria-label="Tên công việc"><button class="primary">Thêm</button></form>
        <div id="notice" role="alert"></div>
        <div class="toolbar"><div class="filters" role="tablist"><button class="filter active" data-filter="all">Tất cả</button><button class="filter" data-filter="active">Chưa xong</button><button class="filter" data-filter="completed">Đã xong</button></div><button id="clear" class="clear">Xóa đã xong</button></div>
        <ul id="tasks"></ul><div id="empty" class="empty" hidden><span>✓</span>Chưa có công việc nào.</div>
        <div class="footer"><span id="count">0 việc chưa xong</span><span id="sync">Đang tải…</span></div>
      </section>
    </main>
    <script>
      let tasks = [], filter = 'all';
      const $ = id => document.getElementById(id);
      function showError(message) { $('notice').textContent = message || ''; }
      function save() {
        $('sync').textContent = 'Đang lưu…';
        google.script.run.withSuccessHandler(saved => { tasks = saved; $('sync').textContent = 'Đã lưu'; render(); }).withFailureHandler(error => { $('sync').textContent = 'Chưa lưu'; showError(error.message || 'Không thể lưu thay đổi.'); }).saveTasks(tasks);
      }
      function render() {
        const shown = tasks.filter(t => filter === 'all' || (filter === 'completed' ? t.completed : !t.completed));
        $('tasks').innerHTML = '';
        shown.forEach(task => {
          const item = document.createElement('li'); item.className = task.completed ? 'done' : '';
          const check = document.createElement('input'); check.type = 'checkbox'; check.className = 'check'; check.checked = task.completed; check.setAttribute('aria-label', 'Đánh dấu hoàn thành'); check.onchange = () => { task.completed = check.checked; save(); };
          const title = document.createElement('span'); title.className = 'title'; title.textContent = task.title;
          const remove = document.createElement('button'); remove.className = 'delete'; remove.textContent = '×'; remove.setAttribute('aria-label', 'Xóa ' + task.title); remove.onclick = () => { tasks = tasks.filter(t => t.id !== task.id); save(); };
          item.append(check, title, remove); $('tasks').append(item);
        });
        $('empty').hidden = shown.length !== 0;
        const remaining = tasks.filter(t => !t.completed).length; $('count').textContent = remaining + ' việc chưa xong';
        document.querySelectorAll('.filter').forEach(button => button.classList.toggle('active', button.dataset.filter === filter));
      }
      $('task-form').onsubmit = event => { event.preventDefault(); const input = $('new-task'), title = input.value.trim(); if (!title) return; showError(''); tasks.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2), title, completed:false, createdAt:Date.now() }); input.value = ''; save(); };
      document.querySelectorAll('.filter').forEach(button => button.onclick = () => { filter = button.dataset.filter; render(); });
      $('clear').onclick = () => { if (tasks.some(t => t.completed)) { tasks = tasks.filter(t => !t.completed); save(); } };
      google.script.run.withSuccessHandler(result => { tasks = result || []; $('sync').textContent = 'Sẵn sàng'; render(); }).withFailureHandler(error => { $('sync').textContent = 'Lỗi tải'; showError(error.message || 'Không thể tải công việc.'); }).getTasks();
    </script>
  </body>
</html>
