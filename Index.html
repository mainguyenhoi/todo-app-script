<!doctype html>
<html lang="vi">
<head>
  <base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--ink:#18233d;--muted:#77819a;--purple:#6757db;--pink:#ff7190;--line:#e9eaf5;--bg:#f6f6fc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#e2ddff 0,transparent 31rem),radial-gradient(circle at 0 45%,#ffe4ec 0,transparent 25rem),var(--bg);color:var(--ink);font:16px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.app{width:min(800px,calc(100% - 32px));margin:auto;padding:clamp(30px,7vw,72px) 0}header{padding:0 8px 27px}.eyebrow{color:var(--purple);font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0 0 9px}h1{font-size:clamp(2.2rem,6vw,3.7rem);letter-spacing:-.065em;line-height:1;margin:0 0 11px}.subtitle{color:var(--muted);margin:0}.card{background:#fff;border:1px solid #fff;border-radius:24px;box-shadow:0 20px 65px #252b6512;overflow:hidden}.folder-bar{padding:16px 18px;border-bottom:1px solid var(--line);display:grid;gap:12px;background:linear-gradient(115deg,#fff 30%,#faf9ff)}.row{display:flex;gap:9px;align-items:center}.crumb{color:var(--muted);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}button{border:0;border-radius:11px;padding:10px 13px;background:#f0effe;color:#5549ba;font:inherit;font-weight:700;cursor:pointer;transition:transform .16s,filter .16s}button:hover{transform:translateY(-1px);filter:brightness(.97)}.primary{background:var(--purple);color:#fff;box-shadow:0 6px 13px #6757db36}button:disabled{opacity:.55;cursor:wait;transform:none}.folders{display:flex;flex-wrap:wrap;gap:8px}.folder{background:#f7f7fb;color:#46516a;font-size:.88rem}.timeline{position:relative;padding:30px 24px 18px}.timeline:before{content:"";position:absolute;left:41px;top:47px;bottom:39px;width:2px;background:linear-gradient(var(--purple),#e5e3ff 85%,transparent)}.step{position:relative;display:grid;grid-template-columns:34px 1fr;gap:14px;padding:0 0 29px}.dot{width:17px;height:17px;margin:11px 0 0 0;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--pink));border:4px solid #edebff;z-index:1;box-shadow:0 3px 10px #6757db38}.entry{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 7px 22px #1f255b09}.entry-head{padding:15px 16px 12px;background:linear-gradient(100deg,#fff,#faf9ff)}.time{font-size:1.02rem;font-weight:800;letter-spacing:-.02em;margin:0}.file{color:var(--muted);font-size:.86rem;margin:3px 0 0;overflow-wrap:anywhere}.photo{width:100%;max-height:500px;display:block;object-fit:contain;background:#f4f4f8;border-top:1px solid var(--line)}.empty{padding:60px 20px;text-align:center;color:var(--muted)}#status{min-height:1.3em;padding:10px 18px 0;color:#b64050;font-size:.9rem}@media(max-width:500px){.app{width:min(100% - 20px,800px);padding-top:27px}header{padding-bottom:20px}.folder-bar{padding:13px}.timeline{padding:23px 13px 12px}.timeline:before{left:29px}.step{grid-template-columns:26px 1fr;gap:9px}.dot{width:15px;height:15px;margin-top:11px}.entry-head{padding:13px}.photo{max-height:380px}}
  </style>
</head>
<body>
  <main class="app"><header><p class="eyebrow">Google Drive</p><h1>Timeline ảnh</h1><p class="subtitle">Từng khoảnh khắc được xếp theo đúng thời gian.</p></header>
    <section class="card"><div class="folder-bar"><div class="row"><button id="back" title="Quay lại folder trước">←</button><span class="crumb" id="path">Google Drive của tôi</span><button id="refresh" class="primary">Làm mới</button></div><div id="folders" class="folders"></div></div><div id="status" role="alert"></div><div id="timeline" class="timeline"></div><div id="empty" class="empty" hidden>Folder này chưa có ảnh.</div></section>
  </main>
  <script>
    const $=id=>document.getElementById(id);let stack=[],selected=null;
    const formatTime=t=>new Intl.DateTimeFormat('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(t));
    function error(e){$('status').textContent=(e&&e.message)||'Không thể đọc Google Drive. Hãy cấp quyền rồi thử lại.'}function setBusy(b){$('refresh').disabled=b}
    function loadFolders(){setBusy(true);$('status').textContent='';const parent=stack.length?stack[stack.length-1].id:null;google.script.run.withSuccessHandler(folders=>{setBusy(false);renderFolders(folders)}).withFailureHandler(e=>{setBusy(false);error(e)}).getDriveFolders(parent)}
    function renderFolders(folders){$('folders').innerHTML='';folders.forEach(folder=>{const b=document.createElement('button');b.className='folder';b.textContent='📁 '+folder.name;b.onclick=()=>{stack.push(folder);selected=folder;renderPath();loadFolders();loadImages()};$('folders').append(b)});if(!folders.length)$('folders').textContent='Không có folder con.';renderPath()}
    function renderPath(){$('path').textContent=['Google Drive của tôi'].concat(stack.map(x=>x.name)).join(' / ');$('back').disabled=!stack.length}
    function loadImages(){if(!selected){$('timeline').innerHTML='';$('empty').hidden=true;return}$('timeline').innerHTML='<div class="empty">Đang tải ảnh…</div>';$('empty').hidden=true;google.script.run.withSuccessHandler(renderImages).withFailureHandler(error).getFolderImages(selected.id)}
    function renderImages(images){$('timeline').innerHTML='';$('empty').hidden=images.length!==0;images.forEach(image=>{const step=document.createElement('article');step.className='step';const dot=document.createElement('div');dot.className='dot';const entry=document.createElement('div');entry.className='entry';const head=document.createElement('div');head.className='entry-head';const time=document.createElement('p');time.className='time';time.textContent=formatTime(image.createdAt);const file=document.createElement('p');file.className='file';file.textContent=image.name;const photo=document.createElement('img');photo.className='photo';photo.src=image.thumbnailUrl;photo.alt=image.name;photo.loading='lazy';photo.onerror=()=>{photo.alt='Không thể tải ảnh – hãy kiểm tra quyền truy cập file.'};head.append(time,file);entry.append(head,photo);step.append(dot,entry);$('timeline').append(step)})}
    $('back').onclick=()=>{if(!stack.length)return;stack.pop();selected=stack.length?stack[stack.length-1]:null;loadFolders();loadImages()};$('refresh').onclick=()=>{loadFolders();loadImages()};loadFolders();
  </script>
</body></html>
