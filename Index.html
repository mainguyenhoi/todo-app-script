<!doctype html>
<html lang="vi"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
:root{--ink:#172033;--muted:#697386;--brand:#5b5ce2;--line:#e8eaf0;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#e7e8ff,transparent 35rem),var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:min(760px,calc(100% - 32px));margin:auto;padding:clamp(32px,8vw,72px) 0}h1{font-size:clamp(2rem,6vw,3.2rem);letter-spacing:-.055em;margin:0 0 7px}.subtitle{color:var(--muted);margin:0 0 28px}.card{background:#fff;border-radius:20px;box-shadow:0 18px 50px #20255a14;overflow:hidden}.folder-bar{padding:18px;border-bottom:1px solid var(--line);display:grid;gap:10px}.row{display:flex;gap:9px;align-items:center}.crumb{color:var(--muted);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}button{border:0;border-radius:10px;padding:10px 13px;background:#f0f0ff;color:var(--brand);font:inherit;font-weight:650;cursor:pointer}.primary{background:var(--brand);color:#fff}button:disabled{opacity:.55;cursor:wait}.folders{display:flex;flex-wrap:wrap;gap:8px}.folder{background:#f7f8fc;color:#35405a;font-size:.9rem}.timeline{position:relative;padding:24px 18px 30px}.timeline:before{content:"";position:absolute;left:34px;top:34px;bottom:35px;width:2px;background:#dddffd}.step{position:relative;display:grid;grid-template-columns:34px 1fr;gap:13px;padding:0 0 23px}.dot{width:14px;height:14px;margin:9px 0 0 1px;border-radius:50%;background:var(--brand);border:3px solid #e3e4ff;z-index:1}.photo{width:100%;max-height:440px;display:block;object-fit:contain;background:#f2f3f7;border-radius:13px;border:1px solid var(--line)}.name{font-weight:700;margin:0 0 3px;overflow-wrap:anywhere}.date{color:var(--muted);font-size:.87rem;margin:0 0 10px}.empty{padding:54px 20px;text-align:center;color:var(--muted)}#status{min-height:1.3em;padding:11px 18px 0;color:#b64050;font-size:.9rem}@media(max-width:480px){.app{width:min(100% - 20px,760px);padding-top:28px}.folder-bar{padding:13px}.timeline{padding:20px 13px}.timeline:before{left:28px}.step{grid-template-columns:28px 1fr;gap:10px}}
</style></head><body><main class="app"><h1>Timeline ảnh</h1><p class="subtitle">Chọn folder từ Google Drive của bạn để xem từng bước theo thời gian.</p><section class="card"><div class="folder-bar"><div class="row"><button id="back" title="Quay lại folder trước">←</button><span class="crumb" id="path">Google Drive của tôi</span><button id="refresh" class="primary">Làm mới</button></div><div id="folders" class="folders"></div></div><div id="status" role="alert"></div><div id="timeline" class="timeline"></div><div id="empty" class="empty" hidden>Folder này chưa có ảnh.</div></section></main><script>
const $=id=>document.getElementById(id);let stack=[],selected=null;const formatDate=t=>new Intl.DateTimeFormat('vi-VN',{dateStyle:'medium',timeStyle:'short'}).format(new Date(t));function error(e){$('status').textContent=(e&&e.message)||'Không thể đọc Google Drive. Hãy cấp quyền rồi thử lại.'}function setBusy(b){$('refresh').disabled=b}function loadFolders(){setBusy(true);$('status').textContent='';const parent=stack.length?stack[stack.length-1].id:null;google.script.run.withSuccessHandler(folders=>{setBusy(false);renderFolders(folders)}).withFailureHandler(e=>{setBusy(false);error(e)}).getDriveFolders(parent)}function renderFolders(folders){$('folders').innerHTML='';folders.forEach(folder=>{const b=document.createElement('button');b.className='folder';b.textContent='📁 '+folder.name;b.onclick=()=>{stack.push(folder);selected=folder;renderPath();loadFolders();loadImages()};$('folders').append(b)});if(!folders.length)$('folders').textContent='Không có folder con.';renderPath()}function renderPath(){$('path').textContent=['Google Drive của tôi'].concat(stack.map(x=>x.name)).join(' / ');$('back').disabled=!stack.length}function loadImages(){if(!selected){$('timeline').innerHTML='';$('empty').hidden=true;return}$('timeline').innerHTML='<div class="empty">Đang tải ảnh…</div>';$('empty').hidden=true;google.script.run.withSuccessHandler(renderImages).withFailureHandler(error).getFolderImages(selected.id)}function renderImages(images){$('timeline').innerHTML='';$('empty').hidden=images.length!==0;images.forEach((image,index)=>{const step=document.createElement('article');step.className='step';const dot=document.createElement('div');dot.className='dot';const content=document.createElement('div');const title=document.createElement('p');title.className='name';title.textContent='Bước '+(index+1)+': '+image.name;const date=document.createElement('p');date.className='date';date.textContent=formatDate(image.createdAt);const photo=document.createElement('img');photo.className='photo';photo.src=image.thumbnailUrl;photo.alt=image.name;photo.loading='lazy';photo.onerror=()=>{photo.alt='Không thể tải ảnh – hãy kiểm tra quyền truy cập file.'};content.append(title,date,photo);step.append(dot,content);$('timeline').append(step)})}$('back').onclick=()=>{if(!stack.length)return;stack.pop();selected=stack.length?stack[stack.length-1]:null;loadFolders();loadImages()};$('refresh').onclick=()=>{loadFolders();loadImages()};loadFolders();
</script></body></html>
