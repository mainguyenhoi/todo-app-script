<!doctype html>
<html lang="vi"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
:root{--ink:#18233d;--muted:#77819a;--purple:#6757db;--pink:#ff7190;--line:#e9eaf5;--bg:#f6f6fc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#e2ddff 0,transparent 31rem),radial-gradient(circle at 0 45%,#ffe4ec 0,transparent 25rem),var(--bg);color:var(--ink);font:16px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.app{width:calc(100% - 64px);margin:auto;padding:clamp(30px,6vw,68px) 0}header{padding:0 10px 27px}.eyebrow{color:var(--purple);font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0 0 9px}h1{font-size:clamp(2.2rem,5vw,3.8rem);letter-spacing:-.065em;line-height:1;margin:0 0 11px}.subtitle{color:var(--muted);margin:0}.card{background:#fff;border:1px solid #fff;border-radius:24px;box-shadow:0 20px 65px #252b6512}.folder-bar{padding:16px 18px;border-bottom:1px solid var(--line);display:grid;gap:12px;border-radius:24px 24px 0 0;background:linear-gradient(115deg,#fff 30%,#faf9ff)}.row{display:flex;gap:9px;align-items:center}.crumb{color:var(--muted);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}button{border:0;border-radius:11px;padding:10px 13px;background:#f0effe;color:#5549ba;font:inherit;font-weight:700;cursor:pointer;transition:transform .16s,filter .16s}button:hover{transform:translateY(-1px);filter:brightness(.97)}.primary{background:var(--purple);color:#fff;box-shadow:0 6px 13px #6757db36}button:disabled{opacity:.55;cursor:wait;transform:none}.folders{display:flex;flex-wrap:wrap;gap:8px}.folder{background:#f7f7fb;color:#46516a;font-size:.88rem}.timeline{position:relative;padding:34px 5.5vw 26px;min-height:160px}.timeline:before{content:"";position:absolute;left:50%;top:46px;bottom:42px;width:3px;transform:translateX(-50%);background:linear-gradient(var(--purple),#e5e3ff 88%,transparent)}.step{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr);min-height:190px;padding-bottom:36px}.dot{grid-column:2;grid-row:1;width:19px;height:19px;justify-self:center;margin-top:17px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--pink));border:4px solid #edebff;z-index:2;box-shadow:0 3px 10px #6757db38}.entry{width:min(100%,430px);position:relative;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 7px 22px #1f255b0c;transition:box-shadow .18s,transform .18s}.entry:hover{z-index:5;box-shadow:0 18px 42px #252b6530;transform:translateY(-3px)}.left .entry{grid-column:1;grid-row:1;justify-self:end;margin-right:9px}.right .entry{grid-column:3;grid-row:1;justify-self:start;margin-left:9px}.left .entry:after,.right .entry:after{content:"";position:absolute;top:25px;width:27px;height:2px;background:#dcdafc}.left .entry:after{right:-28px}.right .entry:after{left:-28px}.entry-head{padding:13px 15px 10px;background:linear-gradient(100deg,#fff,#faf9ff);border-radius:18px 18px 0 0}.time{font-size:1rem;font-weight:800;letter-spacing:-.02em;margin:0}.file{color:var(--muted);font-size:.84rem;margin:3px 0 0;overflow-wrap:anywhere;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.photo{width:100%;height:136px;display:block;object-fit:cover;background:#f4f4f8;border-radius:0 0 17px 17px;border-top:1px solid var(--line);transition:transform .22s ease,box-shadow .22s ease;transform-origin:center center}.entry:hover .photo{transform:scale(1.7);box-shadow:0 20px 45px #1d254744;border-radius:12px;position:relative;z-index:6}.empty{padding:60px 20px;text-align:center;color:var(--muted)}#status{min-height:1.3em;padding:10px 18px 0;color:#b64050;font-size:.9rem}@media(max-width:700px){.app{width:calc(100% - 20px);padding-top:27px}.folder-bar{padding:13px}.timeline{padding:23px 13px 14px}.timeline:before{left:27px;transform:none}.step{grid-template-columns:28px minmax(0,1fr);min-height:0;padding-bottom:25px}.dot{grid-column:1;margin:16px 0 0 1px;width:17px;height:17px}.left .entry,.right .entry{grid-column:2;grid-row:1;justify-self:stretch;width:100%;margin:0}.left .entry:after,.right .entry:after{left:-12px;right:auto;width:12px;top:25px}.photo{height:150px}.entry:hover .photo{transform:scale(1.12)}}
</style></head><body><main class="app"><header><p class="eyebrow">Google Drive</p><h1>Timeline ảnh</h1><p class="subtitle">Mỗi ảnh là một nhánh trong câu chuyện của bạn.</p></header><section class="card"><div class="folder-bar"><div class="row"><button id="back" title="Quay lại folder trước">←</button><span class="crumb" id="path">Google Drive của tôi</span><button id="refresh" class="primary">Làm mới</button></div><div id="folders" class="folders"></div></div><div id="status" role="alert"></div><div id="timeline" class="timeline"></div><div id="empty" class="empty" hidden>Folder này chưa có ảnh.</div></section></main><script>
const $=id=>document.getElementById(id);let stack=[],selected=null;const formatTime=t=>new Intl.DateTimeFormat('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(t));function error(e){$('status').textContent=(e&&e.message)||'Không thể đọc Google Drive. Hãy cấp quyền rồi thử lại.'}function setBusy(b){$('refresh').disabled=b}function loadFolders(){setBusy(true);$('status').textContent='';const parent=stack.length?stack[stack.length-1].id:null;google.script.run.withSuccessHandler(folders=>{setBusy(false);renderFolders(folders)}).withFailureHandler(e=>{setBusy(false);error(e)}).getDriveFolders(parent)}function renderFolders(folders){$('folders').innerHTML='';folders.forEach(folder=>{const b=document.createElement('button');b.className='folder';b.textContent='📁 '+folder.name;b.onclick=()=>{stack.push(folder);selected=folder;renderPath();loadFolders();loadImages()};$('folders').append(b)});if(!folders.length)$('folders').textContent='Không có folder con.';renderPath()}function renderPath(){$('path').textContent=['Google Drive của tôi'].concat(stack.map(x=>x.name)).join(' / ');$('back').disabled=!stack.length}function loadImages(){if(!selected){$('timeline').innerHTML='';$('empty').hidden=true;return}$('timeline').innerHTML='<div class="empty">Đang tải ảnh…</div>';$('empty').hidden=true;google.script.run.withSuccessHandler(renderImages).withFailureHandler(error).getFolderImages(selected.id)}function renderImages(images){$('timeline').innerHTML='';$('empty').hidden=images.length!==0;images.forEach((image,index)=>{const step=document.createElement('article');step.className='step '+(index%2?'right':'left');const dot=document.createElement('div');dot.className='dot';const entry=document.createElement('div');entry.className='entry';const head=document.createElement('div');head.className='entry-head';const time=document.createElement('p');time.className='time';time.textContent=formatTime(image.createdAt);const file=document.createElement('p');file.className='file';file.textContent=image.name;const photo=document.createElement('img');photo.className='photo';photo.src=image.thumbnailUrl;photo.alt=image.name;photo.loading='lazy';photo.onerror=()=>{photo.alt='Không thể tải ảnh – hãy kiểm tra quyền truy cập file.'};head.append(time,file);entry.append(head,photo);step.append(dot,entry);$('timeline').append(step)})}$('back').onclick=()=>{if(!stack.length)return;stack.pop();selected=stack.length?stack[stack.length-1]:null;loadFolders();loadImages()};$('refresh').onclick=()=>{loadFolders();loadImages()};loadFolders();
</script><script>
  const lightbox=document.createElement('div');

    .timeline{padding-top:55px;background-image:radial-gradient(#9b6e43 1px,transparent 1px);background-size:8px 8px}.timeline:before{width:0;border-left:3px dashed #fff1c9;background:none;opacity:.95}.timeline:after{content:'✦  ✿  ♡  ✦  ✿';position:absolute;top:14px;left:50%;transform:translateX(-50%) rotate(-2deg);color:#fff2d0;font-size:1.2rem;white-space:nowrap;text-shadow:1px 2px #79502c66}.dot{background:#ff728e;border-color:#ffe8b8;box-shadow:0 3px 0 #88522e,0 4px 9px #542d1d66}.entry{border:8px solid #fffdf5;border-radius:2px;box-shadow:3px 5px 0 #70452559;transform:rotate(-1.2deg)}.right .entry{transform:rotate(1.2deg)}.entry:hover,.right .entry:hover{transform:rotate(0) translateY(-5px);box-shadow:5px 13px 22px #4e2d1870}.entry:before{content:'';position:absolute;z-index:7;top:-16px;left:50%;width:82px;height:24px;transform:translateX(-50%) rotate(-3deg);background:repeating-linear-gradient(90deg,#ffafbf 0 12px,#ffe0a4 12px 24px);opacity:.92;box-shadow:0 1px 2px #6a3f2555}.entry-head{background:#fffdf5;border-radius:0;padding:12px 13px 8px}.time{font-family:cursive;color:#a35666;font-size:1.1rem}.file{color:#916d50}.photo{height:165px;border:0;border-radius:0;filter:saturate(1.08) contrast(1.03)}.left .entry:after,.right .entry:after{background:#ffe5ad;height:3px}.folder{background:#f9d9a5;color:#725035;box-shadow:1px 2px #8c614638}.primary{background:#eb7c92}.empty{color:#fff7df;font-family:cursive;font-size:1.2rem}
  `;

none;top:18px;width:auto;text-align:left;font-size:.83rem;line-height:1.4}.step{min-height:0;padding-bottom:28px}.entry{width:100%}.step:nth-child(n) .entry{transform:rotate(0)}.photo{height:180px}.timeline .step:nth-child(n):after,.timeline .step:nth-child(n):before{display:none}}
  `;

  const assetStyle=document.createElement('style');
  assetStyle.textContent="body{background:#c7925e url('https://raw.githubusercontent.com/mainguyenhoi/todo-app-script/main/assets/corkboard-memory-bg.png') center top/cover fixed no-repeat}.card{background:rgba(188,134,83,.78);backdrop-filter:blur(1px)}";
